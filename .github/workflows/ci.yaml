name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-poetry
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests with pytest
        run: poetry run pytest

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-poetry

      - name: Lint with ruff
        run: poetry run ruff check src tests

      - name: Check formatting with ruff
        run: poetry run ruff format --check src tests

      - name: Type check with mypy
        run: poetry run mypy src

  complexity:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-poetry

      - name: Cyclomatic complexity report
        run: poetry run radon cc src --average --show-complexity

      - name: Maintainability index report
        run: poetry run radon mi src --show

      # radon itself never exits non-zero; xenon (same author) is the CI gate.
      # Fails the build on any block worse than grade B, per-module worse than B,
      # or a project-wide average worse than A.
      - name: Enforce complexity budget
        run: poetry run xenon --max-absolute B --max-modules B --max-average A src
