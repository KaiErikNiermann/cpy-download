[tool.poetry]
name = "cpy-download"
version = "0.1.0"
description = "Download videos from URLs and copy them to your Linux clipboard"
authors = ["KaiErikNiermann <61298289+KaiErikNiermann@users.noreply.github.com>"]
repository = "https://github.com/KaiErikNiermann/cpy-download"
readme = "README.md"
packages = [{include = "cpy_download", from = "src"}]


[tool.poetry.scripts]
cpydl = "cpy_download.cli:main"

[tool.poetry.dependencies]
python = "^3.11"
typer = ">=0.15.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<10.0"
ruff = ">=0.8,<0.17"
mypy = ">=1.13,<3.0"
radon = "^6.0.1"
xenon = "^0.9.3"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true


[tool.radon]
exclude = "tests/*"
cc_min = "B"


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
